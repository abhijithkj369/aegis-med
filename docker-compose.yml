services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegis_postgres
    environment:
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: aegis_password
      POSTGRES_DB: aegis_med_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegis_med_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    container_name: aegis_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
